name: Existing Pi SSH secrets presence preflight (read-only)
on:
  push:
    branches:
      - infra/pi-ssh-secret-presence-20261120
    paths:
      - .github/workflows/pi-ssh-secrets-readonly-preflight.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PI_HOST: ${{ secrets.TOOLS_PI_HOST }}
      PI_USER: ${{ secrets.TOOLS_PI_USER }}
      PI_SSH_KEY: ${{ secrets.TOOLS_PI_SSH_KEY }}
      PI_TRUSTED_FINGERPRINT: ${{ secrets.TOOLS_PI_HOST_FINGERPRINT }}
    steps:
      - name: Report configuration only (NEVER print values or access SSH)
        shell: bash
        run: |
          set -euo pipefail
          for name in PI_HOST PI_USER PI_SSH_KEY PI_TRUSTED_FINGERPRINT; do
            if [[ -n "${!name:-}" ]]; then
              echo "${name}: CONFIGURED"
            else
              echo "${name}: MISSING"
            fi
          done
          echo "No command executed on Jarvis; no network connection attempted."
